# Project 08 - Automated Server Provisioning
# Configuration file
# No passwords, secrets, or private keys should be stored here.

# Base system settings
TIMEZONE="UTC"
HOSTNAME_MANAGED="false"

# Package management
UPDATE_PACKAGES="false"

# Required packages
REQUIRED_PACKAGES="git curl wget vim tree unzip rsync jq bc lsof strace tcpdump sysstat"

# Commands that must be available on the provisioned server.
# The package manager is used only when a required command is missing.
REQUIRED_COMMANDS="git curl wget vim tree unzip rsync jq bc lsof strace tcpdump iostat"

# Managed group
ADMIN_GROUP="devops"

# Managed users
PROVISION_USER=""

# Runtime directories
RUNTIME_ROOT="/opt/devopsshack/project-08"

RUNTIME_BIN="${RUNTIME_ROOT}/bin"
RUNTIME_CONF="${RUNTIME_ROOT}/conf"
RUNTIME_LOGS="${RUNTIME_ROOT}/logs"

# Logging
LOG_FILE="${RUNTIME_LOGS}/provisioning.log"

# Service settings
ENABLE_CHRONYD="true"
ENABLE_CROND="true"
ENABLE_DOCKER="true"

# Validation
VALIDATE_AFTER_PROVISION="true"
