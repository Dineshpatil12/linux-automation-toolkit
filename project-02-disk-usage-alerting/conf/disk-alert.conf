# ============================================
# Project 2 - Disk Usage Alerting Configuration
# ============================================

# Disk usage thresholds
WARN_THRESHOLD=80
CRIT_THRESHOLD=90

# Inode usage thresholds
INODE_WARN_THRESHOLD=80
INODE_CRIT_THRESHOLD=90

# Do not repeat same alert for 60 minutes
COOLDOWN_MINUTES=60

# Number of largest files/directories to display
TOP_N=5

# Runtime locations
LOG_FILE="/opt/devopsshack/logs/disk-alert.log"
STATE_DIR="/opt/devopsshack/state"

# Filesystems to monitor
# Format:
# mount_point:warning_threshold:critical_threshold
MOUNTS="/:80:90"
