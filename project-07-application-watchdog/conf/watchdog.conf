# Project 07 - Application Watchdog Configuration

# Demo application
APP_NAME="demo-app"
APP_DIR="/opt/devopsshack/demo-app"
APP_SCRIPT="/opt/devopsshack/demo-app/app.py"

# Health check
HEALTH_URL="http://127.0.0.1:8080/health"
HEALTH_TIMEOUT=5

# Runtime
RUNTIME_DIR="/opt/devopsshack"
LOG_DIR="/opt/devopsshack/logs"
STATE_DIR="/opt/devopsshack/state"
LOG_FILE="/opt/devopsshack/logs/watchdog.log"

# Recovery
MAX_RETRIES=3
INITIAL_BACKOFF=2
MAX_BACKOFF=30

# Restart-loop protection
MAX_FAILURES=3
FAILURE_WINDOW=300
COOLDOWN_PERIOD=300
